# Builds the sideload binaries and publishes them as a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0      -> builds and publishes "v0.1.0"
#   Actions -> Release -> Run workflow             -> same, for the tag you type
#
# Outputs per release:
#   Windows  Open-Storycraft_<ver>_x64-setup.exe (NSIS installer)
#            open-storycraft-<ver>-windows-x64-portable.zip (exe + skills/)
#   Linux    open-storycraft_<ver>_amd64.deb, Open-Storycraft_<ver>_amd64.AppImage
#            open-storycraft-<ver>-linux-x64.tar.gz (binary + skills/)
#   Android  open-storycraft-<ver>-android.apk (arm64-v8a + armeabi-v7a + x86_64)
#
# APK signing: set these repository secrets to sign with your own key, so
# every release installs as an update over the last one:
#   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD store and key password
#   ANDROID_KEY_ALIAS         key alias (defaults to "upload")
# Without them the APK is signed with a throwaway key made for that run; it
# installs fine, but the next release will not install over it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (created on the selected branch if missing), e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        working-directory: crates/storycraft-app
        run: cargo tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          $ver = "$env:TAG".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ dist/ }
          $p = "portable/open-storycraft"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target/release/open-storycraft.exe $p/
          Copy-Item -Recurse open-storycraft "$p/skills"
          Compress-Archive -Path "$p/*" -DestinationPath "dist/open-storycraft-$ver-windows-x64-portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    # 22.04 so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build packages
        working-directory: crates/storycraft-app
        run: cargo tauri build --bundles deb,appimage
      - name: Collect
        run: |
          ver="${TAG#v}"
          mkdir -p dist portable/open-storycraft
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/
          cp target/release/open-storycraft portable/open-storycraft/
          cp -r open-storycraft portable/open-storycraft/skills
          tar -C portable -czf "dist/open-storycraft-$ver-linux-x64.tar.gz" open-storycraft
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Signing key
        working-directory: crates/storycraft-app/gen/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          alias="${KEY_ALIAS:-upload}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
            password="$KEYSTORE_PASSWORD"
            echo "Signing with the repository keystore."
          else
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore upload-keystore.jks -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "$password" \
              -dname "CN=Open Storycraft, O=Open Storycraft"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK signed with a throwaway key."
          fi
          printf 'keyAlias=%s\npassword=%s\nstoreFile=../upload-keystore.jks\n' "$alias" "$password" > keystore.properties
      - name: Build APK
        working-directory: crates/storycraft-app
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android build --apk --target aarch64 armv7 x86_64
      - name: Collect
        run: |
          ver="${TAG#v}"
          mkdir -p dist
          cp crates/storycraft-app/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/open-storycraft-$ver-android.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Open Storycraft ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows 10/11 (installer) | `Open-Storycraft_*_x64-setup.exe` |
            | Windows (portable, no install) | `open-storycraft-*-windows-x64-portable.zip` — unzip, run `open-storycraft.exe` |
            | Linux (Debian/Ubuntu) | `open-storycraft_*_amd64.deb` |
            | Linux (any distro) | `Open-Storycraft_*_amd64.AppImage` — `chmod +x`, then run |
            | Linux (portable) | `open-storycraft-*-linux-x64.tar.gz` — needs `libwebkit2gtk-4.1` |
            | Android 8+ | `open-storycraft-*-android.apk` — sideload; allow "install unknown apps" |

            Windows SmartScreen may warn because the installer is not code-signed: *More info → Run anyway*.
          files: dist/*
          fail_on_unmatched_files: true
